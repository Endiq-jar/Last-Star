name: Android CI

# Runs on every push to every branch, and can be started by hand from the
# Actions tab (workflow_dispatch).
on:
  push:
    branches: ['**']
  workflow_dispatch:

# One run per branch: a newer push cancels the older build instead of queueing.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The tooling scripts are plain Python 3, no third-party packages.
          python-version: '3.11'

      - name: Cache the fetched toolchain
        uses: actions/cache@v6
        with:
          path: tools/.toolchain
          key: toolchain-${{ runner.os }}-v1

      # aapt2, d8, ecj, apksigner and android.jar all come from npm, the JDK
      # from PyPI. No Android SDK and no Gradle anywhere in the pipeline.
      - name: Fetch the build toolchain
        run: ./tools/fetch_toolchain.sh

      - name: Compile every Java source
        run: |
          source tools/.toolchain/env.sh
          mkdir -p build/ci-classes
          find app/src/main/java -name '*.java' | sort > build/all-sources.txt
          "$JAVA_HOME/bin/java" -jar "$ECJ_JAR" \
            -source 1.8 -target 1.8 -nowarn \
            -bootclasspath "$ANDROID_JAR" -classpath "$ANDROID_JAR" \
            -d build/ci-classes @build/all-sources.txt

      # Catches shader errors that only a driver would normally report -- the
      # class of bug that once left the app showing nothing but its clear colour.
      - name: Lint the shaders for GLES2 rules
        run: |
          python3 tools/extract_shaders.py
          python3 tools/check_glsl.py

      # Runs SceneRenderer.init and UiRenderer.init against a stand-in GLES20 so
      # a shader that would not compile on a phone fails the build instead.
      - name: Verify the GL start-up path
        run: ./tools/render_path_test.sh

      - name: Verify the FBX import path
        run: python3 tools/tests/test_fbx_import.py

      - name: Run the headless verification suite
        run: |
          source tools/.toolchain/env.sh
          ./tools/run_tests.sh --tests

      - name: Build and sign the APK
        run: |
          source tools/.toolchain/env.sh
          ./tools/build_apk.sh

      - name: Confirm the model set is packaged
        run: |
          set -euo pipefail
          apk="$(ls -t apk/*.apk | head -1)"
          unzip -l "$apk" | grep -q 'assets/models/world.bin' \
            || { echo "::error::assets/models/world.bin is missing from $apk"; exit 1; }
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: last-star-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30
