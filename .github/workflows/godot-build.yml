name: Godot build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  validate-and-export-android:
    name: Validate and export Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python for GDScript checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GDScript tools
        run: python -m pip install gdtoolkit==4.5.0

      - name: Check GDScript formatting and lint
        run: |
          gdformat --check scripts/laststar/*.gd
          gdlint scripts/laststar/*.gd

      - name: Install Java for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$android_home"
          sdkmanager_bin="$(find "$android_home/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_bin"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --version

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -eu
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Download Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_bin="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*-stable_linux.x86_64' -print -quit)"
          test -n "$godot_bin"
          chmod +x "$godot_bin"
          ln -sf "$godot_bin" "$RUNNER_TEMP/godot/godot"
          export PATH="$RUNNER_TEMP/godot:$PATH"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/template-files"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/template-files"
          template_apk="$(find "$RUNNER_TEMP/template-files" -type f -name 'android_debug.apk' -print -quit)"
          test -n "$template_apk"
          template_dir="$(dirname "$template_apk")"
          test -d "$template_dir"
          cp -a "$template_dir"/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 \
            -validity 10000 -noprompt
          sed -i \
            -e "s|^keystore/debug=\"\"$|keystore/debug=\"$RUNNER_TEMP/debug.keystore\"|" \
            -e 's|^keystore/debug_user=""$|keystore/debug_user="androiddebugkey"|' \
            -e 's|^keystore/debug_password=""$|keystore/debug_password="android"|' \
            export_presets.cfg

      - name: Import project and load the main scene headlessly
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --path . --quit-after 8

      - name: Export Android debug APK for ARMv7 and ARM64
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p builds/android
          set +e
          godot --headless --verbose --editor --path . --export-debug "Android" builds/android/LastStar-debug.apk > "$RUNNER_TEMP/godot-export.log" 2>&1
          export_status=$?
          set -e
          if [[ $export_status -ne 0 ]]; then
            cat "$RUNNER_TEMP/godot-export.log"
            echo "### Android export failure (exit $export_status)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Godot Android export exited with status $export_status"
            cat "$RUNNER_TEMP/godot-export.log" >> "$GITHUB_STEP_SUMMARY"
            diagnostics="$(python3 - "$RUNNER_TEMP/godot-export.log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          hits = [i for i, line in enumerate(lines) if any(term in line.lower() for term in ("configuration errors", "error:", "failed:", "not found", "invalid", "exception", "fatal"))]
          if hits:
              start = max(0, hits[-1] - 3)
              end = min(len(lines), hits[-1] + 18)
              print(" | ".join(lines[start:end]))
          else:
              print(" | ".join(lines[-25:]))
          PY
            )"
            echo "::error::Godot export diagnostics: $diagnostics"
            exit 1
          fi
          cat "$RUNNER_TEMP/godot-export.log"
          if [[ ! -s builds/android/LastStar-debug.apk ]]; then
            echo "::error::Godot returned without creating a non-empty APK at builds/android/LastStar-debug.apk. Files under builds:"
            find builds -maxdepth 4 -type f -printf '%p (%s bytes)\\n' || true
            exit 1
          fi
          unzip -Z1 builds/android/LastStar-debug.apk > "$RUNNER_TEMP/apk-files.txt"
          for abi in armeabi-v7a arm64-v8a; do
            if ! grep -q "^lib/$abi/" "$RUNNER_TEMP/apk-files.txt"; then
              echo "::error::APK is missing native libraries for the requested Android ABI: $abi"
              exit 1
            fi
          done

      - name: Upload Godot export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-diagnostics
          path: ${{ runner.temp }}/godot-export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LastStar-Android-debug
          path: builds/android/LastStar-debug.apk
          if-no-files-found: error
          retention-days: 14
